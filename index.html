<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallzy Studio - Minimalist Wallpaper Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0b0e;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b0b0e; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-white selection:text-black">

    <header class="sticky top-0 z-40 bg-[#0b0b0e]/90 backdrop-blur-xl border-b border-white/5 px-4 py-3.5 flex justify-between items-center">
        <div class="flex items-center space-x-2.5 cursor-pointer" onclick="switchTab('explore')">
            <div class="w-8 h-8 rounded-xl bg-white text-black flex items-center justify-center font-bold text-sm shadow-md">W</div>
            <span class="font-bold text-sm tracking-tight text-white">Wallzy Studio</span>
        </div>
        
        <div class="flex items-center space-x-2">
            <div id="authContainer">
                <button onclick="handleGoogleLogin()" class="bg-white hover:bg-gray-100 text-gray-900 text-xs font-semibold px-3 py-2 rounded-xl flex items-center space-x-1.5 shadow-md transition cursor-pointer active:scale-95">
                    <i class="fa-brands fa-google text-xs"></i>
                    <span>Đăng nhập</span>
                </button>
            </div>
            <button onclick="switchTab('admin')" class="bg-[#16161a] hover:bg-[#222228] text-white text-xs font-semibold px-3.5 py-2 rounded-xl border border-white/10 flex items-center space-x-2 shadow-md transition cursor-pointer active:scale-95">
                <i class="fa-solid fa-cloud-arrow-up text-xs"></i>
                <span>Đăng ảnh</span>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-4 pb-24">

        <!-- Tab Khám Phá -->
        <section id="exploreTab" class="space-y-4">
            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-xs"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Tìm kiếm hình nền..." class="w-full bg-[#121216] border border-white/10 text-white text-xs rounded-2xl pl-10 pr-4 py-3.5 focus:outline-none focus:border-white/30 transition placeholder-gray-500 shadow-inner">
            </div>

            <div class="flex space-x-2 overflow-x-auto pb-1 scrollbar-none">
                <button onclick="filterCategory('all')" id="cat-all" class="category-btn bg-white text-black text-xs font-semibold px-4 py-2 rounded-xl transition cursor-pointer whitespace-nowrap shadow-sm">Tất cả</button>
                <button onclick="filterCategory('gradient')" id="cat-gradient" class="category-btn bg-[#16161a] hover:bg-[#222228] text-gray-300 text-xs font-semibold px-4 py-2 rounded-xl border border-white/10 transition cursor-pointer whitespace-nowrap">Gradient</button>
                <button onclick="filterCategory('anime')" id="cat-anime" class="category-btn bg-[#16161a] hover:bg-[#222228] text-gray-300 text-xs font-semibold px-4 py-2 rounded-xl border border-white/10 transition cursor-pointer whitespace-nowrap">Anime</button>
                <button onclick="filterCategory('scenery')" id="cat-scenery" class="category-btn bg-[#16161a] hover:bg-[#222228] text-gray-300 text-xs font-semibold px-4 py-2 rounded-xl border border-white/10 transition cursor-pointer whitespace-nowrap">Phong cảnh</button>
            </div>

            <div id="wallpaperGrid" class="grid grid-cols-2 gap-3.5"></div>
        </section>

        <!-- Tab Yêu thích -->
        <section id="favoritesTab" class="space-y-4 hidden">
            <div class="space-y-1">
                <h2 class="text-sm font-bold text-white tracking-wide">Yêu thích</h2>
                <p class="text-xs text-gray-400">Hình nền bạn đã lưu.</p>
            </div>
            <div id="favoritesGrid" class="grid grid-cols-2 gap-3.5"></div>
        </section>

        <!-- Tab Pha màu Gradient -->
        <section id="gradientTab" class="space-y-4 hidden">
            <div class="space-y-1">
                <h2 class="text-sm font-bold text-white tracking-wide">Gradient Studio</h2>
                <p class="text-xs text-gray-400">Tạo gradient và thêm vào bộ sưu tập.</p>
            </div>

            <div class="bg-[#121216] border border-white/10 rounded-2xl p-4 space-y-4 shadow-xl">
                <div class="w-full h-44 rounded-xl shadow-inner border border-white/10 transition-all duration-300" id="gradientPreviewBox" style="background: linear-gradient(135deg, #4f46e5, #ec4899);"></div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[11px] text-gray-400 font-medium">Màu 1</label>
                        <div class="flex items-center space-x-2 bg-[#16161a] border border-white/10 p-2 rounded-xl">
                            <input type="color" id="gradColor1" value="#4f46e5" oninput="updateGradient()" class="w-7 h-7 rounded-lg bg-transparent cursor-pointer border-0">
                            <span class="text-xs text-gray-300 font-mono" id="gradHex1">#4F46E5</span>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[11px] text-gray-400 font-medium">Màu 2</label>
                        <div class="flex items-center space-x-2 bg-[#16161a] border border-white/10 p-2 rounded-xl">
                            <input type="color" id="gradColor2" value="#ec4899" oninput="updateGradient()" class="w-7 h-7 rounded-lg bg-transparent cursor-pointer border-0">
                            <span class="text-xs text-gray-300 font-mono" id="gradHex2">#EC4899</span>
                        </div>
                    </div>
                </div>

                <button onclick="saveCustomGradient()" class="w-full bg-white hover:bg-gray-100 text-gray-900 font-semibold py-3 rounded-xl text-xs transition shadow-md cursor-pointer flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>Thêm Gradient vào Kho</span>
                </button>
            </div>
        </section>

        <!-- Tab Tải ảnh lên -->
        <section id="adminTab" class="space-y-4 hidden">
            <div class="space-y-1">
                <h2 class="text-sm font-bold text-white tracking-wide">Đăng Ảnh Mới</h2>
                <p class="text-xs text-gray-400">Tải ảnh lên Database chung.</p>
            </div>

            <div class="bg-[#121216] border border-white/10 rounded-2xl p-4 space-y-4 shadow-xl">
                <div class="space-y-1">
                    <label class="text-[11px] text-gray-400 font-medium">Danh mục</label>
                    <select id="uploadCategory" class="w-full bg-[#16161a] border border-white/10 text-white text-xs rounded-xl p-3 focus:outline-none">
                        <option value="gradient">Gradient</option>
                        <option value="anime">Anime</option>
                        <option value="scenery">Phong cảnh</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="text-[11px] text-gray-400 font-medium">Tệp ảnh</label>
                    <input type="file" id="imageFileInput" accept="image/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-[#16161a] file:text-white cursor-pointer border border-white/10 rounded-xl p-2 bg-[#16161a]">
                </div>

                <button onclick="uploadImageToCloud()" class="w-full bg-white hover:bg-gray-100 text-gray-900 font-semibold py-3 rounded-xl text-xs transition shadow-md cursor-pointer flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-cloud-arrow-up text-xs"></i>
                    <span>Tải lên Database chung</span>
                </button>
            </div>
        </section>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-2xl mx-auto bg-[#0b0b0e]/90 backdrop-blur-2xl border-t border-white/5 py-2.5 px-6 flex justify-around items-center z-40 shadow-2xl">
        <button onclick="switchTab('explore')" id="nav-explore" class="flex flex-col items-center space-y-1 text-white transition cursor-pointer">
            <i class="fa-solid fa-compass text-base"></i>
            <span class="text-[10px] font-medium">Khám phá</span>
        </button>
        <button onclick="switchTab('favorites')" id="nav-favorites" class="flex flex-col items-center space-y-1 text-gray-500 hover:text-white transition cursor-pointer">
            <i class="fa-solid fa-heart text-base"></i>
            <span class="text-[10px] font-medium">Yêu thích</span>
        </button>
        <button onclick="switchTab('gradient')" id="nav-gradient" class="flex flex-col items-center space-y-1 text-gray-500 hover:text-white transition cursor-pointer">
            <i class="fa-solid fa-palette text-base"></i>
            <span class="text-[10px] font-medium">Pha màu</span>
        </button>
    </nav>

    <!-- Modal Chi tiết ảnh -->
    <div id="detailModal" class="fixed inset-0 bg-black/95 backdrop-blur-2xl z-[1000] hidden flex flex-col justify-between p-5 animate-fade-in">
        <div class="flex justify-between items-center relative z-10">
            <button onclick="closeModal()" class="text-white text-xs bg-black/40 hover:bg-black/60 backdrop-blur-md rounded-full w-10 h-10 flex items-center justify-center transition cursor-pointer border border-white/10 shadow-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <span class="text-[10px] font-semibold uppercase tracking-widest text-white/70 bg-black/40 backdrop-blur-md px-3 py-1 rounded-full border border-white/10" id="modalCategory">Wallpaper</span>
            <div class="flex items-center space-x-2">
                <button onclick="deleteCurrentImage()" class="text-red-400 text-xs bg-black/40 hover:bg-black/60 backdrop-blur-md rounded-full w-10 h-10 flex items-center justify-center transition cursor-pointer border border-white/10 shadow-lg" title="Xóa ảnh">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
                <button onclick="toggleFavoriteCurrent()" class="text-white text-xs bg-black/40 hover:bg-black/60 backdrop-blur-md rounded-full w-10 h-10 flex items-center justify-center transition cursor-pointer border border-white/10 shadow-lg">
                    <i id="modalFavIcon" class="fa-regular fa-heart"></i>
                </button>
            </div>
        </div>

        <div class="absolute inset-0 flex items-center justify-center p-4">
            <img id="detailImg" src="" alt="Detail" class="max-h-full max-w-full object-contain rounded-2xl shadow-2xl">
        </div>
        
        <div class="relative z-10 flex flex-col space-y-2.5 p-5 w-full max-w-sm mx-auto">
            <button onclick="downloadCurrentImage()" class="w-full bg-white hover:bg-gray-100 text-gray-900 font-semibold py-3.5 rounded-2xl shadow-xl transition flex items-center justify-center space-x-2 cursor-pointer">
                <i class="fa-solid fa-download text-xs"></i>
                <span class="text-[11px] uppercase tracking-wider font-semibold">Tải ảnh về máy</span>
            </button>
        </div>
    </div>

    <!-- Toast thông báo -->
    <div id="messageBox" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-[#18181b] border border-white/10 text-white text-xs px-4 py-3 rounded-2xl shadow-2xl z-[2000] hidden transition-all">
        <span id="messageText">Thông báo</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'wallzy-studio-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "mock-api-key",
            authDomain: "mock-app.firebaseapp.com",
            projectId: "mock-project"
        };

        let app, db, auth;
        let currentUser = null;
        let wallpapers = [];
        let favorites = JSON.parse(localStorage.getItem('wallzy_favorites_v3') || '[]');
        let currentCategory = 'all';
        let searchQuery = '';
        let currentSelectedWallpaper = null;

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
            if (token) {
                signInWithCustomToken(auth, token).catch(() => signInAnonymously(auth));
            } else {
                signInAnonymously(auth).catch(() => {});
            }

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                updateAuthUI();
            });

            // Lắng nghe dữ liệu thời gian thực từ Firestore
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'wallpapers');
            onSnapshot(colRef, (snapshot) => {
                wallpapers = [];
                snapshot.forEach(docSnap => {
                    wallpapers.push(docSnap.data());
                });
                // Sắp xếp mới nhất lên đầu
                wallpapers.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                updateGrid();
            }, (error) => {
                console.log("Firestore sync notice:", error);
                loadLocalFallback();
            });

        } catch (e) {
            console.log("Offline mode initialized");
            loadLocalFallback();
        }

        function loadLocalFallback() {
            wallpapers = JSON.parse(localStorage.getItem('wallzy_wallpapers_v3') || '[]');
            updateGrid();
        }

        window.handleGoogleLogin = async function() {
            try {
                if (firebaseConfig.apiKey === "mock-api-key") {
                    showToast("Đang chạy chế độ mô phỏng. Vui lòng cấu hình Firebase thật để đăng nhập Google.");
                    return;
                }
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
                showToast("Đăng nhập thành công!");
            } catch (err) {
                console.error(err);
                showToast("Đăng nhập thất bại. Vui lòng thử lại.");
            }
        }

        window.handleLogout = async function() {
            try {
                await signOut(auth);
                showToast("Đã đăng xuất.");
            } catch (e) {}
        }

        function updateAuthUI() {
            const container = document.getElementById('authContainer');
            if (!container) return;

            if (currentUser && !currentUser.isAnonymous && currentUser.email) {
                container.innerHTML = `
                    <div class="flex items-center space-x-2 bg-[#16161a] border border-white/10 px-3 py-1.5 rounded-xl">
                        <span class="text-[11px] text-gray-300 font-medium truncate max-w-[100px]">${currentUser.email}</span>
                        <button onclick="handleLogout()" class="text-red-400 text-xs hover:text-red-300 cursor-pointer" title="Đăng xuất">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        </button>
                    </div>`;
            } else {
                container.innerHTML = `
                    <button onclick="handleGoogleLogin()" class="bg-white hover:bg-gray-100 text-gray-900 text-xs font-semibold px-3 py-2 rounded-xl flex items-center space-x-1.5 shadow-md transition cursor-pointer active:scale-95">
                        <i class="fa-brands fa-google text-xs"></i>
                        <span>Đăng nhập</span>
                    </button>`;
            }
        }

        window.switchTab = function(tabName) {
            ['explore', 'favorites', 'gradient', 'admin'].forEach(t => {
                const el = document.getElementById(t + 'Tab');
                if (el) el.classList.add('hidden');
                const nav = document.getElementById('nav-' + t);
                if (nav) {
                    nav.classList.remove('text-white');
                    nav.classList.add('text-gray-500');
                }
            });

            const activeEl = document.getElementById(tabName + 'Tab');
            if (activeEl) activeEl.classList.remove('hidden');
            const activeNav = document.getElementById('nav-' + tabName);
            if (activeNav) {
                activeNav.classList.remove('text-gray-500');
                activeNav.classList.add('text-white');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.filterCategory = function(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(b => {
                b.className = "category-btn bg-[#16161a] hover:bg-[#222228] text-gray-300 text-xs font-semibold px-4 py-2 rounded-xl border border-white/10 transition cursor-pointer whitespace-nowrap";
            });
            const activeBtn = document.getElementById('cat-' + cat);
            if (activeBtn) {
                activeBtn.className = "category-btn bg-white text-black text-xs font-semibold px-4 py-2 rounded-xl transition cursor-pointer whitespace-nowrap shadow-sm";
            }
            updateGrid();
        }

        window.handleSearch = function() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            updateGrid();
        }

        function updateGrid() {
            const grid = document.getElementById('wallpaperGrid');
            if (!grid) return;

            let list = [...wallpapers];
            if (currentCategory !== 'all') {
                list = list.filter(w => w.category === currentCategory);
            }
            if (searchQuery) {
                list = list.filter(w => (w.category && w.category.toLowerCase().includes(searchQuery)) || w.id.toLowerCase().includes(searchQuery));
            }

            if (list.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-2 text-center py-16 space-y-3 bg-[#121216] border border-white/10 rounded-2xl p-6">
                        <i class="fa-solid fa-image text-3xl text-gray-600"></i>
                        <p class="text-xs text-gray-400">Chưa có hình nền nào trên Database.</p>
                        <button onclick="switchTab('admin')" class="bg-white text-gray-900 font-semibold px-4 py-2 rounded-xl text-xs transition shadow-sm cursor-pointer inline-block">
                            Đăng ảnh ngay
                        </button>
                    </div>`;
                updateFavoritesGrid();
                return;
            }

            grid.innerHTML = list.map(w => `
                <div onclick="openModal('${w.id}')" class="group relative aspect-[9/16] rounded-2xl overflow-hidden bg-[#16161a] border border-white/10 cursor-pointer shadow-lg transition-all duration-300 hover:scale-[1.02]">
                    <img src="${w.url}" alt="Wallpaper" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" loading="lazy">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-3">
                        <span class="text-[10px] uppercase font-bold tracking-widest text-white/90">${w.category}</span>
                    </div>
                </div>
            `).join('');

            updateFavoritesGrid();
        }

        window.openModal = function(id) {
            let wallpaper = wallpapers.find(w => w.id === id);
            if (!wallpaper) return;
            currentSelectedWallpaper = wallpaper;
            document.getElementById('modalCategory').innerText = wallpaper.category;
            document.getElementById('detailImg').src = wallpaper.url;
            updateModalFavState();
            document.getElementById('detailModal').classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        window.downloadCurrentImage = function() {
            if (!currentSelectedWallpaper) return;
            const link = document.createElement('a');
            link.href = currentSelectedWallpaper.url;
            link.download = `wallzy-${currentSelectedWallpaper.id}.jpg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("Đã tải ảnh về thành công!");
        }

        window.toggleFavoriteCurrent = function() {
            if (!currentSelectedWallpaper) return;
            const index = favorites.findIndex(f => f.id === currentSelectedWallpaper.id);
            if (index > -1) {
                favorites.splice(index, 1);
                showToast("Đã xóa khỏi yêu thích.");
            } else {
                favorites.push(currentSelectedWallpaper);
                showToast("Đã thêm vào yêu thích!");
            }
            localStorage.setItem('wallzy_favorites_v3', JSON.stringify(favorites));
            updateModalFavState();
            updateFavoritesGrid();
        }

        function updateModalFavState() {
            if (!currentSelectedWallpaper) return;
            const icon = document.getElementById('modalFavIcon');
            const isFav = favorites.some(f => f.id === currentSelectedWallpaper.id);
            if (isFav) {
                icon.className = "fa-solid fa-heart text-red-500";
            } else {
                icon.className = "fa-regular fa-heart text-white";
            }
        }

        function updateFavoritesGrid() {
            const grid = document.getElementById('favoritesGrid');
            if (!grid) return;
            if (favorites.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center py-16 text-xs text-gray-500">Chưa có hình nền yêu thích nào.</div>`;
                return;
            }
            grid.innerHTML = favorites.map(w => `
                <div onclick="openModal('${w.id}')" class="group relative aspect-[9/16] rounded-2xl overflow-hidden bg-[#16161a] border border-white/10 cursor-pointer shadow-lg transition-all duration-300 hover:scale-[1.02]">
                    <img src="${w.url}" alt="Favorite" class="w-full h-full object-cover" loading="lazy">
                </div>
            `).join('');
        }

        window.updateGradient = function() {
            const c1 = document.getElementById('gradColor1').value;
            const c2 = document.getElementById('gradColor2').value;
            document.getElementById('gradHex1').innerText = c1.toUpperCase();
            document.getElementById('gradHex2').innerText = c2.toUpperCase();
            document.getElementById('gradientPreviewBox').style.background = `linear-gradient(135deg, ${c1}, ${c2})`;
        }

        window.saveCustomGradient = async function() {
            const c1 = document.getElementById('gradColor1').value;
            const c2 = document.getElementById('gradColor2').value;
            const gradUrl = `https://placehold.co/1080x1920/${c1.replace('#','')}/${c2.replace('#','')}/?text=Gradient`;

            const newWallpaper = {
                id: 'grad-' + Date.now(),
                url: gradUrl,
                category: 'gradient',
                createdAt: Date.now()
            };

            try {
                if (db) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wallpapers', newWallpaper.id), newWallpaper);
                } else {
                    throw new Error();
                }
            } catch (e) {
                wallpapers.unshift(newWallpaper);
                localStorage.setItem('wallzy_wallpapers_v3', JSON.stringify(wallpapers));
                updateGrid();
            }

            showToast("Đã thêm Gradient thành công!");
            switchTab('explore');
        }

        window.uploadImageToCloud = async function() {
            const fileInput = document.getElementById('imageFileInput');
            const cat = document.getElementById('uploadCategory').value;

            if (!fileInput.files || fileInput.files.length === 0) {
                showToast("Vui lòng chọn một tệp ảnh.");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                const newWallpaper = {
                    id: 'img-' + Date.now(),
                    url: e.target.result,
                    category: cat,
                    createdAt: Date.now()
                };

                try {
                    if (db) {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wallpapers', newWallpaper.id), newWallpaper);
                    } else {
                        throw new Error();
                    }
                    showToast("Đăng ảnh lên Database thành công!");
                } catch (e) {
                    wallpapers.unshift(newWallpaper);
                    localStorage.setItem('wallzy_wallpapers_v3', JSON.stringify(wallpapers));
                    updateGrid();
                    showToast("Đã lưu ảnh cục bộ thành công!");
                }

                fileInput.value = '';
                switchTab('explore');
            };

            reader.onerror = function() {
                showToast("Lỗi đọc tệp ảnh.");
            };

            reader.readAsDataURL(file);
        }

        window.deleteCurrentImage = async function() {
            if (!currentSelectedWallpaper) return;
            try {
                if (db) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wallpapers', currentSelectedWallpaper.id));
                }
            } catch (e) {}

            wallpapers = wallpapers.filter(w => w.id !== currentSelectedWallpaper.id);
            favorites = favorites.filter(f => f.id !== currentSelectedWallpaper.id);
            localStorage.setItem('wallzy_wallpapers_v3', JSON.stringify(wallpapers));
            localStorage.setItem('wallzy_favorites_v3', JSON.stringify(favorites));
            updateGrid();
            closeModal();
            showToast("Đã xóa ảnh thành công!");
        }

        function showToast(text) {
            const box = document.getElementById('messageBox');
            const textEl = document.getElementById('messageText');
            textEl.innerText = text;
            box.classList.remove('hidden');
            setTimeout(() => { box.classList.add('hidden'); }, 3000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateGrid();
        });
    </script>
</body>
</html>
